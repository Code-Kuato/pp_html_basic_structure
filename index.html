<!DOCTYPE html>
<html lang="en"> <!--Language->
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Fits different screen types -->
    <title>Basic HTML Structure</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS -->
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Hello, world!</h1>
    <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main>
        <section>
            <h2>About Us</h2>
            <p>This is a basic HTML structure example.</p>
        </section>
        
        <article>
            <h2>Latest News</h2>
            <p>Here is an article about the latest updates.</p>
        </article>
        
        <aside>
            <h3>Sidebar</h3>
            <p>Additional content goes here.</p>
        </aside>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 My Website. All rights reserved.</p>
    </footer>

    <script src="script.js"></script> <!-- Link to external JavaScript -->

</body>
</html>
